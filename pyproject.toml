[project]
name = "helpdesk-assistant"
version = "0.1.0"
description = "IT Help Desk Agent Assistant — LangGraph orchestrator + Foundry-hosted MAF agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "filelock>=3.13",
    "opentelemetry-api>=1.24",
    "httpx>=0.27",
    # --- Phase 1: classifier (Foundry GPT model via FoundryChatClient) ---
    "agent-framework",
    "agent-framework-foundry",             # FoundryChatClient
    "azure-ai-projects>=2.2",
    "azure-identity>=1.17",
    # --- Phase 1 deploy: classifier as a Foundry hosted agent ---
    "agent-framework-foundry-hosting",     # pre-release — ResponsesHostServer
    # Added in later phases:
    #   Phase 2: azure-search-documents>=11.5,<11.6
    #   Phase 3: azure-ai-evaluation
    #   Phase 4: langgraph, langchain-azure-ai[tools,opentelemetry],
    #            azure-monitor-opentelemetry-exporter (App Insights span export)
]

[project.scripts]
helpdesk-classifier-host = "helpdesk.agents.classifier.host:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# agent-framework-foundry-hosting is published as a pre-release.
prerelease = "allow"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["helpdesk"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["agent_framework_foundry_hosting.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy (transitive via azure-ai-projects) ships 3.12+ syntax in its stubs that
# trips mypy pinned to 3.11; we don't call numpy directly.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
