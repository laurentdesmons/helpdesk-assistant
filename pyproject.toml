[project]
name = "helpdesk-assistant"
version = "0.1.0"
description = "IT Help Desk Agent Assistant — LangGraph orchestrator + Foundry-hosted MAF agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "filelock>=3.13",
    "opentelemetry-api>=1.24",
    # --- Phase 1: classifier ---
    "agent-framework",
    "agent-framework-anthropic",           # pre-release — AnthropicFoundryClient
    "azure-identity>=1.17",
    # Added in later phases:
    #   Phase 1 deploy: agent-framework-foundry-hosting (--pre)
    #   Phase 2: azure-search-documents>=11.5,<11.6, azure-ai-projects
    #   Phase 3: agent-framework-foundry, azure-ai-evaluation
    #   Phase 4: langgraph, langchain-azure-ai[tools,opentelemetry], azure-monitor-*
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# agent-framework-anthropic (and -foundry-hosting) are published as pre-releases.
prerelease = "allow"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["helpdesk"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
