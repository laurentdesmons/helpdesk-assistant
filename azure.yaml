# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Single azd project manifest for the IT Help Desk Agent Assistant (unified
# azure.yaml model — replaces the old agent.manifest.yaml + agent.yaml split).
# https://learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
#
# Services are added as each phase needs them:
#   Phase 0.5 -> ai-project            (connects to the existing helpdesk-dev project)
#   Phase 1   -> classifier agent      (this file; model gpt-4.1-mini, portal-managed)
#   Phase 3   -> resolver agent + gpt-5.4-mini deployment
#   Phase 4   -> orchestrator agent
#
# Model deployments (gpt-4.1-mini for the classifier, the claude-sonnet-5 eval
# judge) are created through the Foundry portal Model catalog and referenced here
# only by deployment name. Infra is synthesized by azd (bicep-less); no infra/ block.

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"

name: helpdesk-assistant

services:
  ai-project:
    host: azure.ai.project
    # Connect to the project provisioned in Phase 0.5 instead of creating a new one.
    endpoint: https://cog-isvx3zxptjnfy.services.ai.azure.com/api/projects/helpdesk-dev
    # No model deployments here — gpt-4.1-mini is portal-managed; gpt-5.4-mini lands in Phase 3.

  classifier:
    host: azure.ai.agent
    kind: hosted
    name: helpdesk-classifier          # matches Settings.classifier_agent_name
    description: IT help desk triage classifier (gpt-4.1-mini).
    project: .                         # repo root — the zip needs the whole helpdesk package
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 1.0.0
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py              # string, not a list — azd runs `python main.py`
      dependencyResolution: remote_build
    startupCommand: python main.py     # used by `azd ai agent run` and container startup
    env:
      # FOUNDRY_PROJECT_ENDPOINT + APPLICATIONINSIGHTS_CONNECTION_STRING are
      # platform-injected — do NOT list them here. FoundryChatClient reads the
      # project endpoint from FOUNDRY_PROJECT_ENDPOINT; the agent MI's implicit
      # project-scoped inference access covers the call (no extra RBAC grant).
      HELPDESK_CLASSIFIER_MODEL: ${HELPDESK_CLASSIFIER_MODEL}
      HELPDESK_LOG_LEVEL: info
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
